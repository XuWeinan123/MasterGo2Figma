<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MasterGo to Figma Restorer</title>
  <meta name="description" content="Import and restore design asset zip bundles in Figma with pixel-perfect fidelity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --background: #f8fafc;
      --foreground: #0f172a;
      --muted: #f1f5f9;
      --muted-foreground: #64748b;
      --card: #ffffff;
      --border: #e2e8f0;
      --input: #f8fafc;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --primary-foreground: #ffffff;
      --secondary: #f1f5f9;
      --secondary-foreground: #0f172a;
      --ring: rgba(0, 102, 204, 0.15);
      --destructive: #ef4444;
      --radius: 12px;
      --font-sans: 'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    }

    body {
      margin: 0;
      font: 13px/1.5 var(--font-sans);
      color: var(--foreground);
      background: var(--background);
      -webkit-font-smoothing: antialiased;
      width: 400px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* App Header */
    .app-header {
      padding: 24px 20px 8px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 4px;
    }

    .app-heading {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #09090b 30%, var(--primary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    .app-subtitle {
      font-size: 12px;
      color: var(--muted-foreground);
      margin: 0;
    }

    main {
      flex: 1;
      min-height: 0;
      padding: 0 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow: hidden;
    }

    h1,
    p {
      margin: 0;
    }

    .muted {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: grid;
      gap: 12px;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
    }

    .card:hover {
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 8px -1px rgba(0, 0, 0, 0.03);
    }

    .card-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted-foreground);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .import-drop-card {
      height: 250px;
      border: 2px dashed rgba(0, 102, 204, 0.15);
      border-radius: var(--radius);
      padding: 0;
      background: rgba(0, 102, 204, 0.01);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .import-drop-card:hover {
      border-color: var(--primary);
      background: rgba(0, 102, 204, 0.03);
      box-shadow: 0 4px 20px -2px rgba(0, 102, 204, 0.05);
    }

    .import-drop-card.dragover {
      border-color: var(--primary);
      background: rgba(0, 102, 204, 0.06);
      box-shadow: 0 4px 24px -2px rgba(0, 102, 204, 0.08);
      transform: scale(1.01);
    }

    .drop-button {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: var(--foreground);
      cursor: pointer;
    }

    .drop-button::before {
      content: "↓";
      font-size: 26px;
      font-weight: 500;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: rgba(0, 102, 204, 0.08);
      transition: transform 0.2s ease;
    }

    .import-drop-card:hover .drop-button::before {
      transform: translateY(2px);
    }

    .file-state-card {
      padding: 12px 16px;
    }

    .compact-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 12px;
    }

    .file-name {
      flex: 1;
      color: var(--foreground);
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button:hover {
      background: var(--secondary);
      color: var(--foreground);
    }

    .page-card {
      padding: 0;
      overflow: hidden;
      gap: 0;
    }

    .page-header {
      min-height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.01);
    }

    .page-list {
      display: grid;
      max-height: 228px;
      overflow: auto;
      background: var(--background);
      align-content: start;
      grid-auto-rows: max-content;
    }

    .page-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 10px;
      align-items: center;
      min-height: 40px;
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .page-row:hover:not(.disabled) {
      background: rgba(0, 102, 204, 0.03);
    }

    .page-row:last-child {
      border-bottom: 0;
    }

    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
      border-radius: 4px;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .page-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 10px;
      color: var(--muted-foreground);
      font-size: 11px;
      background: rgba(0, 0, 0, 0.02);
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.04);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--primary) 0%, #3b82f6 100%);
      border-radius: 999px;
      transition: width 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .status-line {
      min-height: 20px;
      color: var(--foreground);
      font-weight: 600;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .file-name {
      min-width: 0;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .icon-button {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .icon-button:hover {
      background: var(--secondary);
      color: var(--foreground);
    }

    .hidden {
      display: none !important;
    }



    .card {
      border-color: var(--border);
      border-radius: 8px;
      padding: 16px;
      gap: 8px;
    }

    .import-drop-card {
      height: 316px;
      flex: 0 0 316px;
      padding: 0;
      align-items: center;
      justify-content: center;
    }

    .drop-button {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 8px;
      background: transparent;
      flex-direction: column;
      gap: 8px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
      color: var(--foreground);
    }

    .drop-button::before {
      content: "+";
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: var(--secondary);
      color: var(--foreground);
      font-size: 18px;
      line-height: 20px;
    }

    #fileHint {
      display: none;
    }

    .file-state-card,
    .rules-card {
      height: 64px;
      flex: 0 0 64px;
      padding: 16px;
    }

    .page-card {
      height: 280px;
      flex: 0 0 280px;
      padding: 0;
    }

    .page-header {
      height: 48px;
      min-height: 48px;
      padding: 16px;
      border-bottom-color: var(--border);
      grid-template-columns: minmax(0, 1fr) max-content;
      column-gap: 12px;
    }

    .page-list {
      height: 232px;
      max-height: 232px;
      border: 0;
      border-radius: 0;
      background: var(--background);
      align-content: start;
      grid-auto-rows: max-content;
    }

    .page-row {
      height: 44px;
      min-height: 44px;
      padding: 12px 16px;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      gap: 8px;
      border-bottom: 0;
    }

    .page-row:first-child {
      height: 40px;
      min-height: 40px;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--background);
      cursor: pointer;
      flex: 0 0 16px;
    }

    input[type="checkbox"]:checked {
      border-color: var(--primary);
      background: var(--primary);
    }

    input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid var(--primary-foreground);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    input[type="checkbox"]:indeterminate {
      border-color: var(--border);
      background: var(--background);
    }

    input[type="checkbox"]:indeterminate::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 2px;
      background: var(--primary);
      transform: none;
    }

    input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }

    .checkbox-label {
      gap: 8px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
      color: var(--foreground);
    }

    .page-name {
      font-size: 13px;
      line-height: 20px;
      font-weight: 400;
      color: var(--foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-row input:checked+.page-name {
      font-size: 14px;
      line-height: 16px;
    }

    .muted,
    #pageSummary {
      font-size: 14px;
      line-height: 16px;
      color: var(--muted-foreground);
    }

    .badge {
      height: 16px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      font-size: 14px;
      line-height: 16px;
      color: var(--muted-foreground);
      background: transparent;
    }

    .rule-row,
    .compact-row {
      min-height: 32px;
      display: grid;
      grid-template-columns: 56px 24px minmax(0, 1fr) 24px;
      gap: 0;
      align-items: center;
      padding: 0;
    }

    .card-title {
      grid-column: 1;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
      color: var(--foreground);
    }

    .button {
      height: 32px;
      border: 0;
      border-radius: 4px;
      padding: 8px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
    }

    .button-secondary {
      grid-column: 3 / 5;
      justify-self: end;
      width: 72px;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .refresh-font-button {
      grid-column: auto;
      align-self: start;
      white-space: nowrap;
    }

    .file-name {
      grid-column: 3;
      width: 100%;
      text-align: left;
      font-size: 13px;
      line-height: 16px;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button {
      grid-column: 4;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      color: var(--muted-foreground);
    }

    .status-card {
      height: 96px;
      flex: 0 0 96px;
      margin-top: 16px;
      padding: 16px;
      gap: 6px;
    }

    .progress-track {
      height: 8px;
      margin-bottom: 8px;
      border-radius: 3.361px;
      background: var(--secondary);
    }

    .progress-bar {
      background: var(--primary);
    }

    .status-line {
      min-height: 16px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 600;
      color: var(--foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .summary {
      font-size: 13px;
      line-height: 16px;
      color: var(--muted-foreground);
    }

    .button-primary {
      height: 32px;
      flex: 0 0 32px;
      width: 100%;
      min-width: 80px;
      border: 0;
      border-radius: 4px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button-primary:disabled {
      opacity: 0.4;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button:disabled,
    .button.disabled,
    .drop-button.disabled,
    .page-row.disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .error {
      color: var(--destructive);
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="app-heading">
      <h1 class="app-title">MasterGo to Figma</h1>
      <p class="app-subtitle muted">导入并完美还原 MasterGo 设计资产包</p>
    </div>
    <button class="button button-secondary refresh-font-button" id="refreshFonts" type="button" title="重新扫描当前文件并恢复缺失字体">刷新字体</button>
  </header>
  <main>
    <section class="card file-state-card hidden" id="fileState">
      <div class="compact-row">
        <div class="card-title">导入</div>
        <span class="file-name" id="fileNameState"></span>
        <button class="icon-button" id="deleteZip" type="button" title="移除文件">×</button>
      </div>
    </section>

    <section class="card import-drop-card" id="fileDropCard">
      <label class="drop-button" id="fileButton" for="zipInput">
        <span id="fileTitle">选择 zip / .mg 文件</span>
        <span class="muted" id="fileHint">支持 SendToFigma 导出的 zip 与 MasterGo 导出的 .mg</span>
      </label>
      <input class="file-input" id="zipInput" type="file" multiple accept=".zip,.mg,application/zip">
    </section>

    <section class="card page-card hidden" id="pageCard">
      <div class="page-header">
        <label class="checkbox-label">
          <input id="selectAllPages" type="checkbox">
          <span>全选</span>
        </label>
        <span class="muted" id="pageSummary">0 page, 0 layers</span>
      </div>
      <div class="page-list" id="pageList"></div>
    </section>

    <section class="card status-card">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="bar"></div>
      </div>
      <div class="status-line" id="status">准备就绪</div>
      <div class="summary" id="summary">选择 zip 或 .mg 文件后可开始还原。</div>
    </section>

    <button class="button button-primary" id="restore" disabled>开始</button>
  </main>

  <script>
    const zipInput = document.getElementById("zipInput");
    const fileDropCard = document.getElementById("fileDropCard");
    const fileState = document.getElementById("fileState");
    const fileNameState = document.getElementById("fileNameState");
    const deleteZip = document.getElementById("deleteZip");
    const fileButton = document.getElementById("fileButton");
    const fileTitle = document.getElementById("fileTitle");
    const fileHint = document.getElementById("fileHint");
    const pageCard = document.getElementById("pageCard");
    const pageList = document.getElementById("pageList");
    const selectAllPages = document.getElementById("selectAllPages");
    const pageSummary = document.getElementById("pageSummary");
    const restore = document.getElementById("restore");
    const refreshFonts = document.getElementById("refreshFonts");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");

    let manifest = null;
    let entries = {};
    let importLibraryStyles = [];
    let packageRoot = "";
    let pages = [];
    let isBusy = false;
    let hasRules = true;
    let restoreStartMs = 0;
    let importProgressMode = "idle";
    let importProgressStage = "idle";
    let importPrepareUnitsTotal = 0;
    let importPrepareUnitsDone = 0;
    let importRestoreTotal = 0;
    let importAssetBytesTotal = 0;
    let importAssetBytesDone = 0;
    let importPageRecordsTotal = 0;
    let importPageRecordsDone = 0;
    let importRestoredNodesDone = 0;
    let importPostprocessUnitsDone = 0;
    let importFinalizeUnitsDone = 0;
    let activeImportTransferId = "";
    let lastDisplayedPercent = 0;
    let lastImportProgressLabel = "";
    let importTransferSeq = 0;
    let importRequestSeq = 0;
    let activeImportClientTimings = null;
    let pendingImportClientTimings = null;
    const importAckResolvers = {};
    const IMPORT_CHUNK_SIZE = 64 * 1024;
    const IMPORT_YIELD_EVERY_CHUNKS = 32;
    const IMPORT_PROGRESS_STAGES = {
      prepare: { offset: 0, weight: 5 },
      assets: { offset: 5, weight: 20 },
      pageSend: { offset: 25, weight: 10 },
      restore: { offset: 35, weight: 55 },
      postprocess: { offset: 90, weight: 8 },
      finalize: { offset: 98, weight: 2 }
    };
    function send(pluginMessage) {
      parent.postMessage({ pluginMessage }, "*");
    }

    function createImportClientTimings() {
      return {
        totalsMs: {},
        counts: {},
        bytes: {},
        startedAt: Date.now()
      };
    }

    function cloneImportClientTimings(timings) {
      return {
        totalsMs: { ...((timings && timings.totalsMs) || {}) },
        counts: { ...((timings && timings.counts) || {}) },
        bytes: { ...((timings && timings.bytes) || {}) },
        startedAt: Date.now()
      };
    }

    function addClientTiming(name, ms, count) {
      const timings = activeImportClientTimings || pendingImportClientTimings;
      if (!timings || !Number.isFinite(ms)) return;
      timings.totalsMs[name] = (timings.totalsMs[name] || 0) + Math.max(0, Math.round(ms));
      timings.counts[name] = (timings.counts[name] || 0) + (count === undefined ? 1 : Math.max(0, Math.round(count)));
    }

    function setClientTimingCount(name, count) {
      const timings = activeImportClientTimings || pendingImportClientTimings;
      if (!timings || !Number.isFinite(count)) return;
      timings.counts[name] = Math.max(0, Math.round(count));
    }

    function addClientTimingBytes(name, bytes) {
      const timings = activeImportClientTimings || pendingImportClientTimings;
      if (!timings || !Number.isFinite(bytes)) return;
      timings.bytes[name] = (timings.bytes[name] || 0) + Math.max(0, Math.round(bytes));
    }

    function postClientTimings(transferId) {
      if (!activeImportClientTimings) return;
      send({
        type: "import-client-timing",
        transferId,
        clientTimings: activeImportClientTimings
      });
    }

    function setBusy(nextBusy) {
      isBusy = nextBusy;
      restore.disabled = nextBusy || !hasRules || pages.length === 0 || getSelectedPageIds().length === 0;
      refreshFonts.disabled = nextBusy || !hasRules;
      zipInput.disabled = nextBusy;
      deleteZip.disabled = nextBusy;
      selectAllPages.disabled = nextBusy || pages.length === 0;
      fileButton.classList.toggle("disabled", nextBusy);
      pageList.querySelectorAll("input").forEach(input => {
        input.disabled = nextBusy;
        input.closest(".page-row").classList.toggle("disabled", nextBusy);
      });
    }

    function setStatus(message, detail, isError) {
      status.textContent = message;
      status.classList.toggle("error", !!isError);
      if (detail !== undefined) summary.textContent = detail;
    }

    function setProgress(current, total, label) {
      const percent = total > 0 ? Math.round((current / total) * 100) : 0;
      setDisplayedProgress(percent, label || "处理中...", "", current, total);
    }

    function setStageProgress(stage, current, total, label, detail) {
      const config = IMPORT_PROGRESS_STAGES[stage] || { offset: 0, weight: 100 };
      const ratio = total > 0 ? Math.max(0, Math.min(1, current / total)) : 0;
      const percent = config.offset + ratio * config.weight;
      importProgressStage = stage;
      setDisplayedProgress(percent, label || "处理中...", detail || "", current, total);
    }

    function setDisplayedProgress(percent, label, detail, current, total) {
      percent = Math.max(0, Math.min(100, Math.round(percent)));
      if (activeImportTransferId) percent = Math.max(lastDisplayedPercent, percent);
      lastDisplayedPercent = percent;
      lastImportProgressLabel = label || "";
      bar.style.width = `${percent}%`;
      setStatus(label || "处理中...", detail || formatStageProgressDetail(importProgressStage, current || 0, total || 0, percent), false);
    }

    function formatStageProgressDetail(stage, current, total, percent) {
      const totalProgress = `总进度 ${percent}%`;
      if (stage === "assets") return `${formatBytes(current)} / ${formatBytes(total)} · ${totalProgress}`;
      if (stage === "pageSend") return `${current}/${total} 个图层数据已发送 · ${totalProgress}`;
      if (stage === "restore") return `${current}/${total} 个图层 · ${totalProgress} · 预计剩余 ${formatEta(current, total)}`;
      if (stage === "postprocess") return `${Math.round(current)}/${total} 个图层后处理 · ${totalProgress}`;
      if (stage === "finalize") return totalProgress;
      return total > 0 ? `${current}/${total} 项准备任务 · ${totalProgress}` : totalProgress;
    }

    function beginImportPrepareProgress(selectedPages, transferId) {
      importProgressMode = "prepare";
      importProgressStage = "prepare";
      activeImportTransferId = transferId || "";
      lastDisplayedPercent = 0;
      lastImportProgressLabel = "";
      importPrepareUnitsDone = 0;
      importRestoreTotal = selectedPages.reduce((sum, page) => sum + (page.layerCount || 0), 0);
      importPrepareUnitsTotal = Math.max(1, selectedPages.reduce((sum, page) => {
        return sum + (page.layerCount || 0) * 2 + 20;
      }, 0));
      importAssetBytesTotal = 0;
      importAssetBytesDone = 0;
      importPageRecordsTotal = 0;
      importPageRecordsDone = 0;
      importRestoredNodesDone = 0;
      importPostprocessUnitsDone = 0;
      importFinalizeUnitsDone = 0;
      setPrepareProgress("正在整理 zip 数据...");
    }

    function setPrepareProgress(label) {
      if (importProgressMode !== "prepare") {
        if (label) setStatus(label, summary.textContent, false);
        return;
      }
      setStageProgress("prepare", Math.min(importPrepareUnitsDone, importPrepareUnitsTotal), importPrepareUnitsTotal, label);
    }

    function advancePrepareProgress(units, label) {
      if (importProgressMode !== "prepare") {
        if (label) setStatus(label, summary.textContent, false);
        return;
      }
      importPrepareUnitsDone = Math.min(importPrepareUnitsTotal, importPrepareUnitsDone + Math.max(0, units || 0));
      setPrepareProgress(label);
    }

    function beginImportRestoreProgress(label) {
      importProgressMode = "restore";
      importProgressStage = "restore";
      setStageProgress("restore", importRestoredNodesDone, importRestoreTotal, label || "正在开始正式导入...");
    }

    function handleRestoreProgressMessage(message) {
      if (!isCurrentImportMessage(message)) return;
      const current = message.current || 0;
      const total = message.total || 0;
      const label = message.label;
      if (message.stage === "postprocess") {
        importProgressMode = "restore";
        importRestoredNodesDone = Math.max(importRestoredNodesDone, current);
        importPostprocessUnitsDone = Math.max(importPostprocessUnitsDone, message.postprocessCurrent || 0);
        const percent = IMPORT_PROGRESS_STAGES.restore.offset +
          (importRestoreTotal > 0 ? (importRestoredNodesDone / importRestoreTotal) * IMPORT_PROGRESS_STAGES.restore.weight : 0) +
          (importRestoreTotal > 0 ? (importPostprocessUnitsDone / importRestoreTotal) * IMPORT_PROGRESS_STAGES.postprocess.weight : 0);
        importProgressStage = "postprocess";
        setDisplayedProgress(percent, label || "正在进行页面后处理...", "", importPostprocessUnitsDone, importRestoreTotal);
        return;
      }
      if (message.stage === "finalize") {
        importProgressMode = "restore";
        importFinalizeUnitsDone = Math.max(importFinalizeUnitsDone, message.finalizeCurrent || current || 0);
        setStageProgress("finalize", importFinalizeUnitsDone, message.finalizeTotal || total || 1, label || "正在完成最终处理...");
        return;
      }
      if (message.stage === "restore" && current <= 0 && importProgressMode === "prepare") {
        if (label) {
          setStatus(label, summary.textContent, false);
        }
        return;
      }
      if (message.stage === "restore" || current > 0) {
        importRestoredNodesDone = Math.max(importRestoredNodesDone, current);
        if (importProgressMode === "prepare") {
          beginImportRestoreProgress(label);
        }
        setStageProgress("restore", importRestoredNodesDone, total || importRestoreTotal, label);
        return;
      }
      if (importProgressMode === "prepare" && label) {
          setStatus(label, summary.textContent, false);
          return;
      }
      setProgress(current, total, label);
    }

    function resetImportProgressMode() {
      importProgressMode = "idle";
      importProgressStage = "idle";
      importPrepareUnitsTotal = 0;
      importPrepareUnitsDone = 0;
      importRestoreTotal = 0;
      importAssetBytesTotal = 0;
      importAssetBytesDone = 0;
      importPageRecordsTotal = 0;
      importPageRecordsDone = 0;
      importRestoredNodesDone = 0;
      importPostprocessUnitsDone = 0;
      importFinalizeUnitsDone = 0;
      activeImportTransferId = "";
      lastDisplayedPercent = 0;
      lastImportProgressLabel = "";
    }

    function isCurrentImportMessage(message) {
      if (!message || !message.transferId) return true;
      // No active transfer (idle, or reset after a local failure): drop late
      // main-thread progress — it used to repaint over the error status with
      // stale "页面完成" labels and zeroed totals.
      return !!activeImportTransferId && message.transferId === activeImportTransferId;
    }

    function formatBytes(bytes) {
      const value = Math.max(0, bytes || 0);
      if (value < 1024) return `${value} B`;
      if (value < 1024 * 1024) return `${Math.round(value / 1024)} KB`;
      return `${Math.round((value / 1024 / 1024) * 10) / 10} MB`;
    }

    function formatEta(current, total) {
      if (!restoreStartMs || !total || current <= 0 || current >= total) return "--";
      const elapsed = Date.now() - restoreStartMs;
      const remainingMs = Math.max(0, (elapsed / current) * (total - current));
      const seconds = Math.ceil(remainingMs / 1000);
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      return `${minutes}m ${rest}s`;
    }

    // Drag and drop event listeners
    fileDropCard.addEventListener("dragover", (e) => {
      e.preventDefault();
      if (isBusy) return;
      fileDropCard.classList.add("dragover");
    });

    fileDropCard.addEventListener("dragleave", () => {
      fileDropCard.classList.remove("dragover");
    });

    fileDropCard.addEventListener("drop", async (e) => {
      e.preventDefault();
      fileDropCard.classList.remove("dragover");
      if (isBusy) return;
      const files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length > 0) {
        await handleZipFiles(files);
      }
    });

    zipInput.onchange = async () => {
      if (zipInput.files && zipInput.files.length > 0) {
        await handleZipFiles(zipInput.files);
      }
    };

    async function handleZipFiles(files) {
      if (isBusy) return;

      try {
        setBusy(true);
        pendingImportClientTimings = createImportClientTimings();
        activeImportClientTimings = null;

        // Initialize merged manifest
        importLibraryStyles = [];
        const mergedManifest = {
          schema: "mastergo2figma.package.v2",
          version: 2,
          source: "mastergo",
          exportedAt: new Date().toISOString(),
          scope: "composite-pages",
          pages: [],
          assets: {},
          stats: {
            pageCount: 0,
            layerCount: 0,
            imageAssetCount: 0,
            missingImageAssetCount: 0
          }
        };

        // Reset global entries
        entries = {};
        const fileNames = [];

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          fileNames.push(file.name);

          setProgress(0, 0, `正在解析 (${i + 1}/${files.length}): ${file.name}...`);

          const fileReadStartedAt = Date.now();
          const buffer = await file.arrayBuffer();
          addClientTiming("ui.file.arrayBufferMs", Date.now() - fileReadStartedAt);
          addClientTimingBytes("ui.file.bytes", buffer.byteLength || 0);
          const zipReadStartedAt = Date.now();
          let zipEntries = await readZipEntries(buffer);
          addClientTiming("ui.zip.readEntriesMs", Date.now() - zipReadStartedAt, Object.keys(zipEntries).length);

          // MasterGo's native .mg export is also a zip, but instead of a v2
          // manifest it stores a binary "document" + meta.json + images/.
          // Convert it into the same in-memory v2 package the rest of the
          // pipeline already understands, so nothing downstream has to change.
          if (window.MasterGoMg.isMgPackage(file.name, zipEntries)) {
            setProgress(0, 0, `正在解析 .mg (${i + 1}/${files.length}): ${file.name}...`);
            // slimInstanceDescendants: instance-descendant records are only
            // read for override matching in the plugin — full props (455MB of
            // vectorNetwork etc. on the Tesla fixture) OOM the Figma tab.
            // CLI/compare-tool conversions stay full-fidelity (no options).
            zipEntries = window.MasterGoMg.convertMgPackageToV2Entries(zipEntries, file.name, { slimInstanceDescendants: true });
          }

          const manifestPath = findManifestPath(zipEntries);
          if (!manifestPath) {
            throw new Error(`文件 "${file.name}" 中没有 manifest.json`);
          }

          const zipPackageRoot = manifestPath.slice(0, manifestPath.length - "manifest.json".length);

          // Get manifest content
          const manifestBytes = zipEntries[manifestPath];
          if (!manifestBytes) {
            throw new Error(`无法读取 "${file.name}" 的 manifest.json`);
          }

          const manifestParseStartedAt = Date.now();
          const zipManifest = JSON.parse(decodeUtf8(manifestBytes));
          addClientTiming("ui.manifest.parseMs", Date.now() - manifestParseStartedAt);
          const validation = window.MasterGoPackageValidation.validateV2Package(zipEntries, { manifestPath });
          if (!validation.ok) {
            const first = validation.errors[0];
            throw new Error(`文件 "${file.name}" 校验失败：${first.code}（${first.path}）`);
          }

          // Copy entries into global entries with prefix "zip_${i}/"
          for (const path in zipEntries) {
            entries[`zip_${i}/${path}`] = zipEntries[path];
          }

          // Library styles payload (native .mg conversions emit styles.json).
          // Style ids get the same per-zip prefix as record ids so the
          // record-level style refs keep resolving after the merge.
          const stylesBytes = zipEntries[`${zipPackageRoot}styles.json`] || zipEntries["styles.json"];
          if (stylesBytes) {
            try {
              const parsedStyles = JSON.parse(decodeUtf8(stylesBytes));
              if (parsedStyles && Array.isArray(parsedStyles.styles)) {
                for (const style of parsedStyles.styles) {
                  if (style && style.id) importLibraryStyles.push({ ...style, id: `zip_${i}_${style.id}` });
                }
              }
            } catch (e) { /* styles are additive — ignore malformed payloads */ }
          }

          // Merge pages
          for (const page of zipManifest.pages) {
            const mergedPage = {
              ...page,
              id: `zip_${i}_${page.id}`,
              pageFile: `zip_${i}/${zipPackageRoot}${page.pageFile}`,
              zipIndex: i,
              zipPackageRoot: zipPackageRoot
            };
            mergedManifest.pages.push(mergedPage);
          }

          // Merge assets
          if (zipManifest.assets && typeof zipManifest.assets === "object") {
            for (const key in zipManifest.assets) {
              const asset = zipManifest.assets[key];
              if (asset) {
                const mergedKey = `zip_${i}_${key}`;
                mergedManifest.assets[mergedKey] = {
                  ...asset,
                  key: mergedKey,
                  path: asset.path ? `zip_${i}/${zipPackageRoot}${asset.path}` : ""
                };
              }
            }
          }

          // Accumulate stats
          mergedManifest.stats.pageCount += zipManifest.stats?.pageCount || zipManifest.pages.length || 0;
          mergedManifest.stats.layerCount += zipManifest.stats?.layerCount || 0;
          mergedManifest.stats.imageAssetCount += zipManifest.stats?.imageAssetCount || 0;
          mergedManifest.stats.missingImageAssetCount += zipManifest.stats?.missingImageAssetCount || 0;
        }

        manifest = mergedManifest;

        // Show file state
        const fileCount = files.length;
        if (fileCount === 1) {
          fileNameState.textContent = fileNames[0];
          fileNameState.title = fileNames[0];
        } else {
          fileNameState.textContent = `已导入 ${fileCount} 个 zip 文件`;
          fileNameState.title = fileNames.join("\n");
        }

        const imageAssetCount = manifest.stats.imageAssetCount || 0;
        const missingImageAssetCount = manifest.stats.missingImageAssetCount || 0;
        fileHint.textContent = `${manifest.pages.length} 个页面，${manifest.stats.layerCount || 0} 个图层，${imageAssetCount} 个图片资源${missingImageAssetCount ? `，${missingImageAssetCount} 个图片缺失` : ""}`;

        fileDropCard.classList.add("hidden");
        fileState.classList.remove("hidden");
        renderPages(manifest.pages);
        
        // Resize window to show pages list cleanly
        send({
          type: "resize",
          width: 400,
          height: 630
        });

        bar.style.width = "0%";
        setStatus("zip 已读取", "请选择需要还原的页面。", false);

      } catch (error) {
        resetZipState();
        setStatus(error.message || "文件解析失败", "请确认文件为 SendToFigma 导出的 zip 或 MasterGo 导出的 .mg。", true);
      } finally {
        setBusy(false);
      }
    }

    deleteZip.onclick = () => {
      if (isBusy) return;
      resetZipState();
      setStatus("准备就绪", "导入会在当前 Figma 文件中新建还原页面。", false);
    };

    function resetZipState() {
      manifest = null;
      entries = {};
      importLibraryStyles = [];
      packageRoot = "";
      pages = [];
      pendingImportClientTimings = null;
      activeImportClientTimings = null;
      zipInput.value = "";
      fileNameState.textContent = "";
      fileTitle.textContent = "选择 zip / .mg 文件";
      fileHint.textContent = "支持 SendToFigma 导出的 zip 与 MasterGo 导出的 .mg";
      pageList.innerHTML = "";
      pageList.classList.remove("visible");
      pageCard.classList.add("hidden");
      fileDropCard.classList.remove("hidden");
      fileState.classList.add("hidden");

      // Resize window to standard size
      send({
        type: "resize",
        width: 400,
        height: 630
      });

      updatePageSelection();
    }

    function renderPages(nextPages) {
      pages = nextPages || [];
      pageList.innerHTML = "";
      if (pages.length === 0) {
        pageList.classList.remove("visible");
        pageCard.classList.add("hidden");
        updatePageSelection();
        return;
      }
      for (const page of pages) {
        const displayName = page.originalName || page.name;
        const row = document.createElement("label");
        row.className = "page-row";
        row.innerHTML = `
          <input type="checkbox" value="${escapeHtml(page.id)}" checked>
          <span class="page-name" title="${escapeHtml(page.name)}">${escapeHtml(displayName)}</span>
          <span class="badge">${page.layerCount || 0}</span>
        `;
        pageList.appendChild(row);
      }
      pageList.classList.add("visible");
      pageCard.classList.remove("hidden");
      pageList.querySelectorAll("input").forEach(input => {
        input.onchange = updatePageSelection;
      });
      updatePageSelection();
    }

    function updatePageSelection() {
      const selectedIds = getSelectedPageIds();
      const selectedSet = new Set(selectedIds);
      const selectedPages = pages.filter(page => selectedSet.has(page.id));
      const selectedLayerCount = selectedPages.reduce((sum, page) => sum + (page.layerCount || 0), 0);
      pageSummary.textContent = `${selectedPages.length} page${selectedPages.length === 1 ? "" : "s"}, ${selectedLayerCount} layers`;
      selectAllPages.checked = pages.length > 0 && selectedIds.length === pages.length;
      selectAllPages.indeterminate = selectedIds.length > 0 && selectedIds.length < pages.length;
      setBusy(isBusy);
    }

    selectAllPages.onchange = () => {
      pageList.querySelectorAll("input").forEach(input => {
        input.checked = selectAllPages.checked;
      });
      updatePageSelection();
    };

    restore.onclick = async () => {
      if (isBusy) return;
      if (!hasRules) {
        setStatus("请先导入转换规则 JSON", "", true);
        return;
      }

      const selectedIds = getSelectedPageIds();
      if (selectedIds.length === 0) {
        setStatus("请至少选择一个页面", "", true);
        return;
      }

      try {
        setBusy(true);
        restoreStartMs = Date.now();
        if (manifest) {
          const selectedSet = new Set(selectedIds);
          const selectedPages = pages.filter(page => selectedSet.has(page.id));
          await streamImportPayload(manifest, selectedPages);
        } else {
          throw new Error("请先选择有效的 MasterGo2Figma zip");
        }
      } catch (error) {
        setStatus(error.message || "导入数据整理失败", "", true);
        resetImportProgressMode();
        setBusy(false);
      }
    };

    refreshFonts.onclick = () => {
      if (isBusy) return;
      if (!hasRules) {
        setStatus("请先导入转换规则 JSON", "", true);
        return;
      }
      setBusy(true);
      bar.style.width = "0%";
      setStatus("正在刷新字体...", "正在扫描当前文件里的缺失字体文本图层。", false);
      send({ type: "refresh-fonts" });
    };

    function getSelectedPageIds() {
      return [...pageList.querySelectorAll("input:checked")].map(input => input.value);
    }

    // Single recursive pass over a record's props doing what used to be three
    // separate full-tree walks (prefixImageRefs + prefixConnectorEndpointNodeIds
    // + collectImageRefs). The three mutations touch independent fields, so
    // applying them in one visit per node yields identical results; imageRefs
    // are collected after prefixing, matching the previous walk order.
    function prepareImportProps(obj, prefix, assetKeys) {
      if (!obj || typeof obj !== "object") return;
      if (Array.isArray(obj)) {
        for (let i = 0; i < obj.length; i++) {
          prepareImportProps(obj[i], prefix, assetKeys);
        }
        return;
      }
      if (obj.type === "IMAGE" && typeof obj.imageRef === "string") {
        obj.imageRef = prefix + obj.imageRef;
        assetKeys[obj.imageRef] = true;
      }
      if (typeof obj.endpointNodeId === "string") {
        obj.endpointNodeId = prefix + obj.endpointNodeId;
      }
      for (const key in obj) {
        if (Object.prototype.hasOwnProperty.call(obj, key)) {
          prepareImportProps(obj[key], prefix, assetKeys);
        }
      }
    }

    function prepareRecordForImport(record, prefix, assetKeys) {
      record.id = `${prefix}${record.id}`;
      if (record.parentId) record.parentId = `${prefix}${record.parentId}`;
      if (Array.isArray(record.childIds)) {
        record.childIds = record.childIds.map(cid => `${prefix}${cid}`);
      }
      // The component reference must be prefixed like every other record id:
      // the plugin resolves it against restoredNodeById, which is keyed by the
      // PREFIXED ids — an unprefixed ref silently misses and every instance
      // falls back to a frame shell.
      if (record.mainComponentId) record.mainComponentId = `${prefix}${record.mainComponentId}`;
      // Library style refs resolve against the per-zip prefixed style ids.
      if (record.fillStyleRef) record.fillStyleRef = `${prefix}${record.fillStyleRef}`;
      if (record.strokeStyleRef) record.strokeStyleRef = `${prefix}${record.strokeStyleRef}`;
      if (record.effectStyleRef) record.effectStyleRef = `${prefix}${record.effectStyleRef}`;
      if (record.textStyleRef) record.textStyleRef = `${prefix}${record.textStyleRef}`;
      if (record.props) {
        prepareImportProps(record.props, prefix, assetKeys);
      }
    }

    // Cheap pre-flight over all selected pages (page index files exist, parse
    // and pass schema checks, every layer-chunk entry exists) so a broken
    // package still fails BEFORE import-session-start — same failure timing as
    // the old prepare-everything-first flow, without holding all pages' data.
    function verifyPageEntriesExist(selectedPages) {
      for (const page of selectedPages) {
        if (!page.pageFile) throw new Error(`页面缺少索引文件：${page.name || page.id}`);
        const pageBytes = getPackageEntry(page.pageFile);
        if (!pageBytes) throw new Error(`缺少页面索引文件：${page.pageFile}`);
        const pageIndex = JSON.parse(decodeUtf8(pageBytes));
        if (pageIndex.schema !== "mastergo2figma.page.v2" || pageIndex.version !== 2) {
          throw new Error(`页面索引格式不正确：${page.pageFile}`);
        }
        if (!Array.isArray(pageIndex.layerChunks)) throw new Error(`页面缺少图层分块索引：${page.pageFile}`);
        for (const chunkPath of pageIndex.layerChunks) {
          const fullChunkPath = `zip_${page.zipIndex}/${page.zipPackageRoot}${chunkPath}`;
          if (!getPackageEntry(fullChunkPath)) throw new Error(`缺少图层分块文件：${fullChunkPath}`);
        }
      }
    }

    async function streamImportPayload(sourceManifest, selectedPages) {
      const transferId = `import_${Date.now()}_${++importTransferSeq}`;
      activeImportClientTimings = cloneImportClientTimings(pendingImportClientTimings);
      activeImportClientTimings.transferId = transferId;
      activeImportClientTimings.selectedPageCount = selectedPages.length;
      activeImportClientTimings.selectedLayerCount = selectedPages.reduce((sum, page) => sum + (page.layerCount || 0), 0);
      const importStartedAt = Date.now();
      beginImportPrepareProgress(selectedPages, transferId);
      const totalNodes = selectedPages.reduce((sum, page) => sum + (page.layerCount || 0), 0);
      const selectedManifest = {
        ...sourceManifest,
        pages: selectedPages.map(page => ({
          id: page.id,
          name: page.name,
          folder: page.folder,
          pageFile: page.pageFile,
          layerCount: page.layerCount || 0
        })),
        stats: {
          ...(sourceManifest.stats || {}),
          pageCount: selectedPages.length,
          layerCount: totalNodes
        }
      };

      setPrepareProgress("正在校验导入包完整性...");
      verifyPageEntriesExist(selectedPages);
      setClientTimingCount("ui.prepare.selectedPages", selectedPages.length);
      setClientTimingCount("ui.prepare.selectedLayers", totalNodes);

      const sessionStartStartedAt = Date.now();
      await sendImportRequest({
        type: "import-session-start",
        transferId,
        manifest: selectedManifest,
        totalPages: selectedPages.length,
        totalNodes,
        clientTimings: activeImportClientTimings
      });
      addClientTiming("ui.session.startAckMs", Date.now() - sessionStartStartedAt);
      setStatus("已建立导入会话", summary.textContent, false);

      // Library styles go right after the session opens, before any page —
      // node records reference them during restore.
      if (importLibraryStyles.length > 0) {
        await sendImportRequest({
          type: "import-styles",
          transferId,
          styles: importLibraryStyles
        }, 30000);
      }

      // Pages are prepared lazily, one at a time, right before they are sent:
      // the UI's memory peak drops from "records of ALL selected pages at
      // once" to a single page. The on-the-wire message order is unchanged
      // (session-start; then per page: assets → page-start → chunks →
      // page-end). Only progress-label pacing differs, and the progress bar
      // is monotonic by construction (setDisplayedProgress clamps).
      const sentAssetPaths = {};
      for (let pageIndex = 0; pageIndex < selectedPages.length; pageIndex++) {
        const page = selectedPages[pageIndex];
        setPrepareProgress(`正在准备页面：${page.name || page.id}`);
        const pagePrepareStartedAt = Date.now();
        const pageData = buildPageImportData(page);
        addClientTiming("ui.prepare.pageDataMs", Date.now() - pagePrepareStartedAt);
        addClientTiming("ui.prepare.totalMs", Date.now() - pagePrepareStartedAt);
        const assetTransfers = getRequiredAssetTransfers(sourceManifest, pageData.assetKeys, sentAssetPaths);
        importAssetBytesTotal += getAssetTransferBytes(assetTransfers);
        importPageRecordsTotal += getLayerChunkRecordCount(pageData.layerChunks);

        if (assetTransfers.length > 0) {
          setStageProgress("assets", importAssetBytesDone, importAssetBytesTotal, "正在发送图片资源...");
        }
        for (const asset of assetTransfers) {
          await streamImportAsset(transferId, asset);
        }

        setStageProgress("pageSend", importPageRecordsDone, importPageRecordsTotal, `正在发送页面：${pageData.page.name || pageData.page.id}`);
        const pageStartAckStartedAt = Date.now();
        await sendImportRequest({
          type: "import-page-start",
          transferId,
          pageIndex,
          page: pageData.page
        }, 30000);
        addClientTiming("ui.page.startAckMs", Date.now() - pageStartAckStartedAt);
        const pageChunkPostStartedAt = Date.now();
        for (let chunkIndex = 0; chunkIndex < pageData.layerChunks.length; chunkIndex++) {
          const records = pageData.layerChunks[chunkIndex];
          send({
            type: "import-page-chunk",
            transferId,
            pageIndex,
            chunkIndex,
            records
          });
          // Release the UI-side copy right away: the plugin main thread is
          // building its own copy of these records while this loop runs, and
          // on 200k-record pages holding both simultaneously OOMs the tab.
