<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --background: #ffffff;
      --foreground: #09090b;
      --muted: #f4f4f5;
      --muted-foreground: #71717a;
      --card: #ffffff;
      --border: #e4e4e7;
      --input: #e4e4e7;
      --primary: #18181b;
      --primary-foreground: #fafafa;
      --secondary: #f4f4f5;
      --secondary-foreground: #18181b;
      --ring: #a1a1aa;
      --destructive: #dc2626;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--foreground);
      background: var(--background);
    }

    main {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1, p {
      margin: 0;
    }

    h1 {
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .muted {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 650;
    }

    .select-trigger {
      width: 100%;
      height: 36px;
      border: 1px solid var(--input);
      border-radius: 6px;
      background: var(--background);
      color: var(--foreground);
      padding: 0 10px;
      font: inherit;
      outline: none;
    }

    .select-trigger:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px rgba(161, 161, 170, 0.25);
    }

    .file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .page-list {
      display: grid;
      max-height: 326px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--background);
      align-content: start;
      grid-auto-rows: max-content;
    }

    .page-card {
      padding: 0;
      overflow: hidden;
      gap: 0;
    }

    .page-card .page-list {
      border: 0;
      border-radius: 0;
    }

    .page-header {
      min-height: 48px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .page-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .page-row:last-child {
      border-bottom: 0;
    }

    .page-row input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: var(--primary);
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .checkbox-label input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #0a84ff;
    }

    .page-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0 8px;
      color: var(--muted-foreground);
      font-size: 11px;
      white-space: nowrap;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--secondary);
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: var(--primary);
      transition: width 160ms ease;
    }

    .status-line {
      min-height: 20px;
      color: var(--foreground);
      overflow-wrap: anywhere;
    }

    .summary {
      color: var(--muted-foreground);
      font-size: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .rule-row {
      min-height: 36px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .mode-card {
      gap: 10px;
    }

    .segmented {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .segment {
      min-width: 0;
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }

    .segment input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .segment:has(input:checked) {
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .relay-row {
      display: grid;
      gap: 6px;
    }

    .relay-test-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .relay-test-row .button {
      white-space: nowrap;
    }

    .text-input {
      width: 100%;
      height: 32px;
      border: 1px solid var(--input);
      border-radius: 4px;
      background: var(--background);
      color: var(--foreground);
      padding: 0 10px;
      font: inherit;
      outline: none;
    }

    .text-input:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 2px rgba(161, 161, 170, 0.25);
    }

    .file-name {
      min-width: 0;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: right;
    }

    .icon-button {
      width: 24px;
      height: 24px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .icon-button:hover {
      background: var(--secondary);
      color: var(--foreground);
    }

    .hidden {
      display: none !important;
    }

    .button {
      height: 36px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--background);
      color: var(--foreground);
      padding: 0 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .button-primary {
      flex: 1;
      width: 100%;
      border-color: var(--primary);
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button-secondary {
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .button:disabled,
    .button.disabled,
    .select-trigger:disabled,
    .page-row.disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    /* Figma node 30:315 visual spec */
    :root {
      --background: #ffffff;
      --foreground: #1a191a;
      --muted: #efefef;
      --muted-foreground: #737879;
      --card: #ffffff;
      --border: #dfe2e5;
      --input: #dfe2e5;
      --primary: #0186ff;
      --primary-foreground: #ffffff;
      --secondary: #efefef;
      --secondary-foreground: #1a191a;
      --divider: rgba(0, 0, 0, 0.05);
      --radius: 8px;
    }

    body {
      font: 400 13px/20px "Sarasa UI SC", "Sarasa_UI_SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--foreground);
      background: var(--background);
    }

    main {
      width: 400px;
      height: 100vh;
      min-height: 0;
      padding: 16px;
      gap: 16px;
      overflow: hidden;
    }

    .card {
      border-color: var(--border);
      border-radius: 8px;
      padding: 16px;
      gap: 8px;
    }

    .page-card {
      height: 374px;
      flex: 0 0 374px;
      padding: 0;
    }

    .page-header {
      height: 48px;
      min-height: 48px;
      padding: 16px;
      border-bottom-color: var(--divider);
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .page-list {
      height: 326px;
      max-height: 326px;
      border: 0;
      border-radius: 0;
      background: var(--background);
      align-content: start;
      grid-auto-rows: max-content;
    }

    .page-row {
      height: 44px;
      min-height: 44px;
      padding: 12px 16px;
      grid-template-columns: 16px minmax(0, 1fr) auto;
      gap: 8px;
      border-bottom: 0;
    }

    .page-row:first-child {
      height: 40px;
      min-height: 40px;
    }

    input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      position: relative;
      width: 16px;
      height: 16px;
      margin: 0;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--background);
      cursor: pointer;
      flex: 0 0 16px;
    }

    input[type="checkbox"]:checked {
      border-color: var(--primary);
      background: var(--primary);
    }

    input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid var(--primary-foreground);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    input[type="checkbox"]:indeterminate {
      border-color: var(--border);
      background: var(--background);
    }

    input[type="checkbox"]:indeterminate::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 8px;
      height: 8px;
      border: 0;
      border-radius: 2px;
      background: var(--primary);
      transform: none;
    }

    input[type="checkbox"]:disabled {
      cursor: not-allowed;
    }

    .checkbox-label {
      gap: 8px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
      color: var(--foreground);
    }

    .page-name {
      font-size: 13px;
      line-height: 20px;
      font-weight: 400;
      color: var(--foreground);
    }

    .page-row input:checked + .page-name {
      font-size: 14px;
      line-height: 16px;
    }

    .muted,
    #pageSummary {
      font-size: 14px;
      line-height: 16px;
      color: var(--muted-foreground);
    }

    .badge {
      height: 16px;
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      font-size: 14px;
      line-height: 16px;
      color: var(--muted-foreground);
      background: transparent;
    }

    .rules-card {
      height: 64px;
      flex: 0 0 64px;
      padding: 16px;
    }

    .rule-row {
      min-height: 32px;
      display: grid;
      grid-template-columns: 56px 24px minmax(0, 1fr) 24px;
      gap: 0;
      align-items: center;
    }

    .card-title {
      grid-column: 1;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
      color: var(--foreground);
    }

    .button {
      height: 32px;
      border: 0;
      border-radius: 4px;
      padding: 8px;
      font-size: 14px;
      line-height: 16px;
      font-weight: 400;
    }

    .button-secondary {
      grid-column: 3 / 5;
      justify-self: end;
      width: 72px;
      background: var(--secondary);
      color: var(--secondary-foreground);
    }

    .relay-test-row .button-secondary {
      grid-column: auto;
      justify-self: stretch;
      width: auto;
      min-width: 88px;
    }

    .file-name {
      grid-column: 3;
      width: 100%;
      text-align: left;
      font-size: 13px;
      line-height: 16px;
      color: var(--muted-foreground);
    }

    .icon-button {
      grid-column: 4;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      color: var(--muted-foreground);
    }

    .status-card {
      height: 96px;
      flex: 0 0 96px;
      margin-top: 32px;
      padding: 16px;
      gap: 8px;
    }

    .progress-track {
      height: 8px;
      margin-bottom: 8px;
      border-radius: 3.361px;
      background: var(--secondary);
    }

    .progress-bar {
      background: var(--primary);
    }

    .status-line {
      height: 20px;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: var(--foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .summary {
      min-height: 20px;
      font-size: 13px;
      line-height: 20px;
      color: var(--muted-foreground);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .button-primary {
      height: 32px;
      flex: 0 0 32px;
      width: 100%;
      min-width: 80px;
      border: 0;
      border-radius: 4px;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button-primary:disabled {
      opacity: 0.4;
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .button:disabled,
    .button.disabled,
    .page-row.disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .error {
      color: var(--destructive);
    }
  </style>
</head>
<body>
  <main>
    <section class="card mode-card">
      <div class="card-title">传输方式</div>
      <div class="segmented" id="transferModeGroup">
        <label class="segment">
          <input type="radio" name="transferMode" value="direct-zip" checked>
          <span>直接生成 zip</span>
        </label>
        <label class="segment">
          <input type="radio" name="transferMode" value="local-json-stream">
          <span>流传输到本地</span>
        </label>
      </div>
      <div class="relay-row hidden" id="relayConfig">
        <div class="relay-test-row">
          <input class="text-input" id="relayUrlInput" type="url" value="http://127.0.0.1:8765" spellcheck="false">
          <button class="button button-secondary" id="testMainRelay" type="button">主线程测试</button>
        </div>
        <p class="muted" id="relayDiagnostic">先启动本地 Python 中继服务，再开始流传输。</p>
      </div>
    </section>

    <section class="card page-card">
      <div class="page-header">
        <label class="checkbox-label">
          <input id="selectAllPages" type="checkbox">
          <span>全选</span>
        </label>
        <span class="muted" id="pageSummary">正在读取页面...</span>
      </div>
      <div class="page-list" id="pageList"></div>
    </section>

    <section class="card status-card">
      <div class="progress-track" aria-hidden="true">
        <div class="progress-bar" id="bar"></div>
      </div>
      <div class="status-line" id="status">准备就绪</div>
      <div class="summary" id="summary">选择页面后可导出 MasterGo2Figma JSON zip。</div>
    </section>

    <button class="button button-primary" id="start" disabled>开始</button>
  </main>

  <script>
    const selectAllPages = document.getElementById("selectAllPages");
    const pageList = document.getElementById("pageList");
    const pageSummary = document.getElementById("pageSummary");
    const start = document.getElementById("start");
    const bar = document.getElementById("bar");
    const status = document.getElementById("status");
    const summary = document.getElementById("summary");
    const transferModeInputs = [...document.querySelectorAll("input[name='transferMode']")];
    const relayConfig = document.getElementById("relayConfig");
    const relayUrlInput = document.getElementById("relayUrlInput");
    const testMainRelay = document.getElementById("testMainRelay");
    const relayDiagnostic = document.getElementById("relayDiagnostic");

    const TRANSFER_MODE_DIRECT_ZIP = "direct-zip";
    const TRANSFER_MODE_LOCAL_JSON_STREAM = "local-json-stream";
    const EXPORT_TARGET_LOCAL_RELAY = "local-relay";
    const DEFAULT_RELAY_URL = "http://127.0.0.1:8765";
    const AUTO_CONTINUE_DELAY_MS = 800;
    let isBusy = false;
    let hasRules = true;
    let pages = [];
    let currentPageId = "";
    let exportTransfer = null;
    let localRelayTransfer = null;
    let currentTransferMode = TRANSFER_MODE_DIRECT_ZIP;
    let operationStartMs = 0;
    let pendingExportQueue = null;
    let autoExportSession = null;
    let autoContinueTimer = 0;

    function send(pluginMessage) {
      parent.postMessage({ pluginMessage }, "*");
    }

    function setBusy(nextBusy) {
      isBusy = nextBusy;
      start.disabled = nextBusy || !hasRules || getSelectedPageIds().length === 0;
      selectAllPages.disabled = nextBusy || pages.length === 0;
      relayUrlInput.disabled = nextBusy;
      testMainRelay.disabled = nextBusy;
      transferModeInputs.forEach(input => {
        input.disabled = nextBusy;
      });
      pageList.querySelectorAll("input").forEach(input => {
        input.disabled = nextBusy;
        input.closest(".page-row").classList.toggle("disabled", nextBusy);
      });
    }

    function getTransferMode() {
      const checked = transferModeInputs.find(input => input.checked);
      return checked && checked.value === TRANSFER_MODE_LOCAL_JSON_STREAM
        ? TRANSFER_MODE_LOCAL_JSON_STREAM
        : TRANSFER_MODE_DIRECT_ZIP;
    }

    function normalizeRelayUrl(value) {
      const text = String(value || "").trim() || DEFAULT_RELAY_URL;
      return text.replace(/\/+$/, "");
    }

    function updateTransferMode() {
      currentTransferMode = getTransferMode();
      relayConfig.classList.toggle("hidden", currentTransferMode !== TRANSFER_MODE_LOCAL_JSON_STREAM);
      if (pendingExportQueue && pendingExportQueue.nextPageId && !isBusy) {
        renderExportQueueStatus(pendingExportQueue);
      } else if (currentTransferMode === TRANSFER_MODE_LOCAL_JSON_STREAM) {
        summary.textContent = "JSON 和图片会流式写入本地服务，完成后生成 zip。";
        relayDiagnostic.textContent = "先启动本地 Python 中继服务，再开始流传输。";
        relayDiagnostic.classList.remove("error");
      } else {
        summary.textContent = "适合较小文件，导出完成后直接下载 zip。";
      }
      setBusy(isBusy);
    }

    function setProgress(current, total, label) {
      const percent = total > 0 ? Math.round((current / total) * 100) : 0;
      bar.style.width = `${Math.max(0, Math.min(100, percent))}%`;
      status.textContent = label || "处理中...";
      status.classList.remove("error");
      const detail = total > 0
        ? `${current}/${total} 个图层，${percent}% · 预计剩余 ${formatEta(current, total)}`
        : "正在准备任务...";
      summary.textContent = withAutoSessionSummary(detail);
    }

    function setFileProgress(current, total, label) {
      const percent = total > 0 ? Math.round((current / total) * 100) : 0;
      bar.style.width = total > 0 ? `${Math.max(0, Math.min(100, percent))}%` : "8%";
      if (label) {
        status.textContent = label;
        status.classList.remove("error");
      }
      const detail = total > 0 ? `${current}/${total} 个文件，${percent}%` : `${current} 个文件`;
      summary.textContent = withAutoSessionSummary(detail);
    }

    function formatEta(current, total) {
      if (!operationStartMs || !total || current <= 0 || current >= total) return "--";
      const elapsed = Date.now() - operationStartMs;
      const remainingMs = Math.max(0, (elapsed / current) * (total - current));
      const seconds = Math.ceil(remainingMs / 1000);
      if (seconds < 60) return `${seconds}s`;
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      return `${minutes}m ${rest}s`;
    }

    function isAutoSessionActive() {
      return !!(autoExportSession && autoExportSession.active);
    }

    function withAutoSessionSummary(detail) {
      if (!isAutoSessionActive()) return detail;
      const session = autoExportSession;
      const currentPage = Math.min(session.completedPages + 1, session.totalPageCount);
      return `页面 ${currentPage}/${session.totalPageCount} · ${detail} · 已完成 ${session.completedPages} 页 / ${session.completedPackages} 个 zip`;
    }

    function renderAutoExportSessionStatus(label) {
      if (!isAutoSessionActive()) return;
      const session = autoExportSession;
      const currentPage = Math.min(session.completedPages + 1, session.totalPageCount);
      status.textContent = label || `正在连续导出 ${currentPage}/${session.totalPageCount}`;
      status.classList.remove("error");
      summary.textContent = `已完成 ${session.completedPages}/${session.totalPageCount} 页，${session.completedPackages} 个 zip，${formatBytes(session.totalBytes)}，${session.totalLayers} 个图层`;
    }

    function createSessionId() {
      return `session-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function startAutoExportSession(pageIds, relayUrl) {
      clearTimeout(autoContinueTimer);
      autoExportSession = {
        id: createSessionId(),
        active: true,
        relayUrl,
        totalPageCount: pageIds.length,
        originalPageIds: pageIds.slice(),
        pendingPageIds: pageIds.slice(),
        completedPages: 0,
        completedPackages: 0,
        batchesStarted: 0,
        totalFiles: 0,
        totalBytes: 0,
        totalLayers: 0,
        imageAssetCount: 0,
        missingImageAssetCount: 0,
        outputs: [],
        startedAt: Date.now()
      };
      console.log("[MasterGo2Figma UI] Auto export session start", {
        sessionId: autoExportSession.id,
        pageCount: pageIds.length,
        relayUrl
      });
      dispatchAutoExportBatch(pageIds);
    }

    async function dispatchAutoExportBatch(pageIds) {
      if (!isAutoSessionActive()) return;
      const session = autoExportSession;
      const nextPageIds = (pageIds || []).filter(Boolean);
      if (nextPageIds.length === 0) {
        finishAutoExportSession();
        return;
      }

      session.pendingPageIds = nextPageIds.slice();
      session.batchesStarted += 1;
      setBusy(true);
      renderAutoExportSessionStatus(`正在准备第 ${Math.min(session.completedPages + 1, session.totalPageCount)}/${session.totalPageCount} 页...`);

      try {
        await ensureLocalRelayAvailable(session.relayUrl);
      } catch (error) {
        failAutoExportSession(error.message || "本地中继服务连接失败");
        return;
      }

      console.log("[MasterGo2Figma UI] Auto export batch start", {
        sessionId: session.id,
        batchIndex: session.batchesStarted,
        remainingPageCount: nextPageIds.length,
        nextPageId: nextPageIds[0]
      });
      send({
        type: "start-export",
        transferMode: TRANSFER_MODE_LOCAL_JSON_STREAM,
        relayUrl: session.relayUrl,
        scope: "partial-pages",
        pageIds: nextPageIds,
        autoContinue: true,
        sessionId: session.id,
        batchIndex: session.batchesStarted,
        batchTotal: session.totalPageCount
      });
    }

    function scheduleNextAutoExportBatch(queue) {
      if (!isAutoSessionActive()) return;
      if (!queue || !Array.isArray(queue.pageIds) || queue.pageIds.length === 0) {
        finishAutoExportSession();
        return;
      }
      autoExportSession.pendingPageIds = queue.pageIds.slice();
      renderAutoExportSessionStatus(`当前页完成，准备继续下一页...`);
      clearTimeout(autoContinueTimer);
      autoContinueTimer = setTimeout(() => {
        dispatchAutoExportBatch(queue.pageIds);
      }, AUTO_CONTINUE_DELAY_MS);
    }

    function noteAutoExportTransferComplete(message, outputPath) {
      if (!isAutoSessionActive()) return;
      const session = autoExportSession;
      const stats = message.stats || {};
      session.completedPackages += 1;
      session.totalFiles += message.fileCount || 0;
      session.totalBytes += message.totalBytes || 0;
      if (outputPath) session.outputs.push(outputPath);

      if (message.isFinal !== false) {
        session.completedPages = Math.min(session.completedPages + 1, session.totalPageCount);
        session.totalLayers += stats.layerCount || 0;
        session.imageAssetCount += stats.imageAssetCount || 0;
        session.missingImageAssetCount += stats.missingImageAssetCount || 0;
      }
      renderAutoExportSessionStatus(message.isFinal === false ? "当前分包已生成，继续当前页面..." : "当前页面已完成，准备下一页...");
    }

    function finishAutoExportSession() {
      if (!autoExportSession) return;
      const session = autoExportSession;
      session.active = false;
      clearTimeout(autoContinueTimer);
      bar.style.width = "100%";
      status.textContent = "连续导出完成";
      status.classList.remove("error");
      summary.textContent = `${session.completedPages}/${session.totalPageCount} 页，${session.completedPackages} 个 zip，${formatBytes(session.totalBytes)}，${session.totalLayers} 个图层`;
      console.log("[MasterGo2Figma UI] Auto export session complete", {
        sessionId: session.id,
        completedPages: session.completedPages,
        packages: session.completedPackages,
        bytes: session.totalBytes,
        outputs: session.outputs
      });
      autoExportSession = null;
      setBusy(false);
    }

    function failAutoExportSession(message) {
      if (autoExportSession) {
        console.error("[MasterGo2Figma UI] Auto export session failed", {
          sessionId: autoExportSession.id,
          message,
          pendingPageIds: autoExportSession.pendingPageIds
        });
        autoExportSession.active = false;
      }
      clearTimeout(autoContinueTimer);
      status.textContent = message || "连续导出失败";
      status.classList.add("error");
      summary.textContent = "当前队列已保留，可修复问题后重新打开插件或再次点击开始继续。";
      setBusy(false);
    }

    function formatBytes(value) {
      const bytes = Number(value) || 0;
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
      return `${Math.round(bytes / 1024 / 1024)} MB`;
    }

    function renderPages(nextPages) {
      pages = nextPages || [];
      pageList.innerHTML = "";
      const defaultPageId = pendingExportQueue && pendingExportQueue.nextPageId
        ? pendingExportQueue.nextPageId
        : currentPageId;
      for (const page of pages) {
        const row = document.createElement("label");
        row.className = "page-row";
        row.innerHTML = `
          <input type="checkbox" value="${escapeHtml(page.id)}" ${page.id === defaultPageId ? "checked" : ""}>
          <span class="page-name" title="${escapeHtml(page.name)}">${escapeHtml(page.name)}</span>
          <span class="badge">${page.childCount || 0}</span>
        `;
        pageList.appendChild(row);
      }
      pageList.querySelectorAll("input").forEach(input => {
        input.onchange = updatePageSelection;
      });
      updatePageSelection();
      renderExportQueueStatus(pendingExportQueue);
    }

    function applyExportQueueSelection(queue) {
      if (!queue || !queue.nextPageId) return;
      pageList.querySelectorAll("input").forEach(input => {
        input.checked = input.value === queue.nextPageId;
      });
      updatePageSelection();
      renderExportQueueStatus(queue);
    }

    function renderExportQueueStatus(queue) {
      if (!queue || !queue.nextPageId || isBusy) return;
      const nextName = queue.nextPageName || queue.nextPageId;
      status.textContent = `导出队列：下一页 ${nextName}`;
      status.classList.remove("error");
      summary.textContent = `剩余 ${queue.remainingCount || 0} 页，点击开始继续。`;
    }

    function getSelectedPageIds() {
      return [...pageList.querySelectorAll("input:checked")].map(input => input.value);
    }

    function updatePageSelection() {
      const selectedIds = getSelectedPageIds();
      const selectedSet = new Set(selectedIds);
      const selectedPages = pages.filter(page => selectedSet.has(page.id));
      const selectedLayerCount = selectedPages.reduce((sum, page) => sum + (page.childCount || 0), 0);
      pageSummary.textContent = `${selectedPages.length} page${selectedPages.length === 1 ? "" : "s"}, ${selectedLayerCount} layers`;
      selectAllPages.checked = pages.length > 0 && selectedIds.length === pages.length;
      selectAllPages.indeterminate = selectedIds.length > 0 && selectedIds.length < pages.length;
      setBusy(isBusy);
    }

    selectAllPages.onchange = () => {
      pageList.querySelectorAll("input").forEach(input => {
        input.checked = selectAllPages.checked;
      });
      updatePageSelection();
    };

    transferModeInputs.forEach(input => {
      input.onchange = updateTransferMode;
    });

    testMainRelay.onclick = () => {
      if (isBusy) return;
      const relayUrl = normalizeRelayUrl(relayUrlInput.value);
      relayUrlInput.value = relayUrl;
      relayDiagnostic.textContent = "正在从插件主线程测试 /health...";
      relayDiagnostic.classList.remove("error");
      status.textContent = "正在测试主线程直连本地服务...";
      status.classList.remove("error");
      summary.textContent = "这会验证 code.ts 是否可以绕过 UI bridge 直接访问 localhost。";
      testMainRelay.disabled = true;
      send({
        type: "test-main-fetch-relay",
        relayUrl
      });
    };

    start.onclick = async () => {
      if (isBusy) return;
      const pageIds = getSelectedPageIds();
      if (pageIds.length === 0) {
        status.textContent = "请至少选择一个页面";
        status.classList.add("error");
        summary.textContent = "";
        return;
      }

      setBusy(true);
      operationStartMs = Date.now();
      const transferMode = getTransferMode();
      const relayUrl = normalizeRelayUrl(relayUrlInput.value);
      if (transferMode === TRANSFER_MODE_LOCAL_JSON_STREAM) {
        try {
          relayUrlInput.value = relayUrl;
          setProgress(0, 0, "正在连接本地中继服务...");
          await ensureLocalRelayAvailable(relayUrl);
        } catch (error) {
          status.textContent = error.message || "本地中继服务连接失败";
          status.classList.add("error");
          summary.textContent = "请先运行 python3 tools/mastergo_relay_server.py。";
          setBusy(false);
          return;
        }
        startAutoExportSession(pageIds, relayUrl);
        return;
      } else {
        setProgress(0, 0, "正在启动导出...");
      }
      send({
        type: "start-export",
        transferMode,
        relayUrl: transferMode === TRANSFER_MODE_LOCAL_JSON_STREAM ? relayUrl : "",
        scope: "partial-pages",
        pageIds
      });
    };

    function getPluginMessage(event) {
      if (!event || !event.data) return null;
      if (event.data.pluginMessage) return event.data.pluginMessage;
      return event.data;
    }

    async function ensureLocalRelayAvailable(relayUrl) {
      let response;
      try {
        response = await fetch(`${relayUrl}/health`, { method: "GET" });
      } catch (error) {
        throw new Error(`无法连接本地中继服务：${relayUrl}`);
      }
      const payload = await readRelayResponse(response);
      if (!payload.ok) throw new Error(payload.error || "本地中继服务不可用");
      return payload;
    }

    function isLocalRelayMessage(message) {
      return message && message.target === EXPORT_TARGET_LOCAL_RELAY;
    }

    function getLocalRelayTransfer(message) {
      if (!localRelayTransfer || localRelayTransfer.transferId !== message.transferId) return null;
      return localRelayTransfer;
    }

    function createLocalRelayEndpoint(transfer, suffix) {
      return `${transfer.relayUrl}/transfers/${encodeURIComponent(transfer.transferId)}${suffix}`;
    }

    async function readRelayResponse(response) {
      let payload = null;
      try {
        payload = await response.json();
      } catch (_) {
        payload = null;
      }
      if (!response.ok) {
        const message = payload && payload.error ? payload.error : `${response.status} ${response.statusText}`;
        throw new Error(message);
      }
      return payload || { ok: true };
    }

    async function postRelayJson(transfer, suffix, data) {
      const response = await fetch(createLocalRelayEndpoint(transfer, suffix), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data || {})
      });
      const payload = await readRelayResponse(response);
      if (payload.ok === false) throw new Error(payload.error || "本地中继服务返回失败");
      return payload;
    }

    async function postRelayBytes(transfer, suffix, bytes) {
      const response = await fetch(createLocalRelayEndpoint(transfer, suffix), {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream" },
        body: bytes
      });
      const payload = await readRelayResponse(response);
      if (payload.ok === false) throw new Error(payload.error || "本地中继服务返回失败");
      return payload;
    }

    function enqueueLocalRelay(transfer, task) {
      const next = transfer.queue.then(() => {
        if (transfer.error) throw transfer.error;
        return task();
      });
      transfer.queue = next.catch(error => {
        transfer.error = error instanceof Error ? error : new Error(String(error));
      });
      return next;
    }

    function startLocalRelayTransfer(message) {
      localRelayTransfer = {
        transferId: message.transferId,
        relayUrl: normalizeRelayUrl(message.relayUrl),
        filename: message.filename || "mastergo2figma",
        fileCount: message.fileCount || 0,
        receivedFiles: 0,
        totalBytes: 0,
        stats: message.stats || null,
        files: {},
        queue: Promise.resolve(),
        error: null,
        outputDir: ""
      };
      const transfer = localRelayTransfer;
      enqueueLocalRelay(transfer, () => postRelayJson(transfer, "/start", {
        filename: transfer.filename,
        startedAt: new Date().toISOString()
      })).catch(() => {});
      status.textContent = "本地流传输已开始";
      status.classList.remove("error");
    }

    function startLocalRelayFile(message) {
      const transfer = getLocalRelayTransfer(message);
      if (!transfer) return;
      transfer.files[message.index] = {
        path: message.path,
        size: message.size || 0,
        chunks: message.totalChunks || 0,
        ended: false
      };
      enqueueLocalRelay(transfer, () => postRelayJson(transfer, "/files/start", {
        index: message.index,
        path: message.path,
        kind: message.kind,
        size: message.size || 0,
        totalChunks: message.totalChunks || 0
      })).catch(() => {});
    }

    function appendLocalRelayFileChunk(message) {
      const transfer = getLocalRelayTransfer(message);
      if (!transfer) return;
      const bytes = message.bytes !== undefined
        ? normalizeBytes(message.bytes)
        : new TextEncoder().encode(message.content || "");
      transfer.totalBytes += bytes.length;
      enqueueLocalRelay(transfer, () => postRelayBytes(
        transfer,
        `/files/chunk?index=${encodeURIComponent(message.index)}&chunkIndex=${encodeURIComponent(message.chunkIndex || 0)}`,
        bytes
      )).catch(() => {});
    }

    async function acknowledgeLocalRelayFile(message) {
      const transfer = getLocalRelayTransfer(message);
      let success = false;
      let errorMessage = "";
      let path = message.path || "";

      try {
        if (!transfer) throw new Error("本地流传输不存在或已被重置");
        const file = transfer.files[message.index];
        path = path || (file && file.path) || "";
        await enqueueLocalRelay(transfer, () => postRelayJson(transfer, "/files/end", {
          index: message.index
        }));
        if (file) file.ended = true;
        transfer.receivedFiles += 1;
        success = true;
      } catch (error) {
        errorMessage = error.message || "本地文件写入失败";
        console.error(`[MasterGo2Figma UI] Local relay file failed: ${errorMessage}`);
      }

      const pendingCount = transfer
        ? Object.keys(transfer.files).filter(index => !transfer.files[index].ended).length
        : 0;
      send({
        type: "export-file-finished",
        transferId: message.transferId,
        index: message.index,
        success,
        error: errorMessage,
        pendingCount,
        path
      });
    }

    function abortLocalRelayFile(message) {
      const transfer = getLocalRelayTransfer(message);
      if (!transfer) return;
      enqueueLocalRelay(transfer, () => postRelayJson(transfer, "/files/abort", {
        index: message.index,
        reason: message.reason || ""
      })).catch(() => {});
    }

    async function completeLocalRelayTransfer(message) {
      const transfer = getLocalRelayTransfer(message);
      if (!transfer) {
        send({
          type: "export-transfer-finished",
          transferId: message.transferId,
          success: false,
          error: "本地流传输不存在或已被重置",
          pendingCount: 0,
          filename: message.filename || ""
        });
        return;
      }

      let success = false;
      let errorMessage = "";
      let pendingCount = 0;
      let outputDir = "";
      let zipPath = "";

      try {
        pendingCount = Object.keys(transfer.files).filter(index => !transfer.files[index].ended).length;
        if (pendingCount > 0) throw new Error(`本地流传输不完整（${pendingCount} 个文件未完成）`);
        transfer.fileCount = message.fileCount || transfer.fileCount || transfer.receivedFiles;
        transfer.stats = message.stats || transfer.stats;
        const payload = await enqueueLocalRelay(transfer, () => postRelayJson(transfer, "/complete", {
          filename: message.filename || transfer.filename,
          fileCount: transfer.fileCount,
          totalBytes: message.totalBytes || transfer.totalBytes,
          stats: transfer.stats || {},
          isFinal: message.isFinal !== false,
          completedAt: new Date().toISOString()
        }));
        outputDir = payload.outputDir || "";
        zipPath = payload.zipPath || "";
        transfer.outputDir = outputDir;
        if (message.isFinal !== false) bar.style.width = "100%";
        status.textContent = message.isFinal === false ? "当前分包已写入本地，继续导出..." : "本地 zip 已生成";
        status.classList.remove("error");
        const stats = transfer.stats || {};
        const imageAssetCount = stats.imageAssetCount || 0;
        const missingImageAssetCount = stats.missingImageAssetCount || 0;
        noteAutoExportTransferComplete(message, zipPath || outputDir || transfer.filename);
        if (!isAutoSessionActive()) {
          summary.textContent = `${zipPath || outputDir || transfer.transferId}，${stats.pageCount || 0} 个页面，${stats.layerCount || 0} 个图层，${imageAssetCount} 个图片资源${missingImageAssetCount ? `，${missingImageAssetCount} 个图片缺失` : ""}`;
        }
        success = true;
      } catch (error) {
        errorMessage = error.message || "本地流传输失败";
        status.textContent = errorMessage;
        status.classList.add("error");
        summary.textContent = "请查看本地 Python 服务终端和插件控制台。";
      } finally {
        pendingCount = Object.keys(transfer.files).filter(index => !transfer.files[index].ended).length;
      }

      localRelayTransfer = null;
      const keepBusy = success && (message.isFinal === false || isAutoSessionActive());
      setBusy(keepBusy);
      send({
        type: "export-transfer-finished",
        transferId: message.transferId,
        success,
        error: errorMessage,
        pendingCount,
        filename: zipPath || outputDir || transfer.filename
      });
      if (!success && autoExportSession) {
        failAutoExportSession(errorMessage);
      }
    }

    function startExportTransfer(message) {
      exportTransfer = {
        transferId: message.transferId,
        filename: message.filename || "mastergo2figma.zip",
        fileCount: message.fileCount || 0,
        pending: {},
        receivedFiles: 0,
        stats: message.stats || null,
        encoder: new TextEncoder(),
        localParts: [],
        centralParts: [],
        offset: 0
      };
    }

    function getTransfer(message) {
      if (!exportTransfer || exportTransfer.transferId !== message.transferId) return null;
      return exportTransfer;
    }

    function startExportFile(message) {
      const transfer = getTransfer(message);
      if (!transfer) return;
      const nameBytes = transfer.encoder.encode(message.path);
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const localView = new DataView(localHeader.buffer);
      writeLocalHeader(localView, nameBytes.length, 0, 0, ZIP_FLAG_DATA_DESCRIPTOR);
      localHeader.set(nameBytes, 30);
      const fileOffset = transfer.offset;
      const localPartsStart = transfer.localParts.length;
      const offsetBefore = transfer.offset;
      transfer.localParts.push(localHeader);
      transfer.offset += localHeader.length;
      transfer.pending[message.index] = {
        path: message.path,
        kind: message.kind,
        nameBytes,
        offset: fileOffset,
        localPartsStart,
        offsetBefore,
        crc: -1,
        size: 0
      };
    }

    function appendExportFileChunk(message) {
      const transfer = getTransfer(message);
      if (!transfer) return;
      const pending = transfer.pending[message.index];
      if (!pending) return;
      const data = pending.kind === "bytes"
        ? normalizeBytes(message.bytes)
        : transfer.encoder.encode(message.content || "");
      pending.crc = crc32Update(pending.crc, data);
      pending.size += data.length;
      transfer.localParts.push(data);
      transfer.offset += data.length;
    }

    function finishExportFile(message) {
      const transfer = getTransfer(message);
      if (!transfer) throw new Error("导出传输不存在或已被重置");
      const pending = transfer.pending[message.index];
      if (!pending) throw new Error(`导出文件不存在或已中止：${message.index}`);

      const path = pending.path;
      const crc = (pending.crc ^ -1) >>> 0;
      const descriptor = new Uint8Array(16);
      const descriptorView = new DataView(descriptor.buffer);
      descriptorView.setUint32(0, 0x08074b50, true);
      descriptorView.setUint32(4, crc, true);
      descriptorView.setUint32(8, pending.size, true);
      descriptorView.setUint32(12, pending.size, true);
      transfer.localParts.push(descriptor);
      transfer.offset += descriptor.length;

      const centralHeader = new Uint8Array(46 + pending.nameBytes.length);
      const centralView = new DataView(centralHeader.buffer);
      writeCentralHeader(centralView, pending.nameBytes.length, crc, pending.size, pending.offset, ZIP_FLAG_DATA_DESCRIPTOR);
      centralHeader.set(pending.nameBytes, 46);
      transfer.centralParts.push(centralHeader);

      delete transfer.pending[message.index];
      transfer.receivedFiles += 1;
      return path;
    }

    function abortExportFile(message) {
      const transfer = getTransfer(message);
      if (!transfer) return;
      const pending = transfer.pending[message.index];
      if (!pending) return;
      transfer.localParts.splice(pending.localPartsStart);
      transfer.offset = pending.offsetBefore;
      delete transfer.pending[message.index];
      console.warn(`[MasterGo2Figma UI] File transfer aborted: ${pending.path}; reason=${message.reason || ""}`);
    }

    function acknowledgeExportFile(message) {
      const transfer = getTransfer(message);
      let success = false;
      let errorMessage = "";
      let path = message.path || "";

      try {
        path = finishExportFile(message) || path;
        success = true;
      } catch (error) {
        errorMessage = error.message || "导出文件写入失败";
        console.error(`[MasterGo2Figma UI] File write failed: ${errorMessage}`);
      }

      const pendingCount = transfer ? Object.keys(transfer.pending).length : 0;
      send({
        type: "export-file-finished",
        transferId: message.transferId,
        index: message.index,
        success,
        error: errorMessage,
        pendingCount,
        path
      });
    }

    async function completeExportTransfer(message) {
      const transfer = getTransfer(message);
      if (!transfer) {
        send({
          type: "export-transfer-finished",
          transferId: message.transferId,
          success: false,
          error: "导出传输不存在或已被重置",
          pendingCount: 0,
          filename: message.filename || ""
        });
        return;
      }
      let blob = null;
      let success = false;
      let errorMessage = "";
      let pendingCount = 0;

      try {
        pendingCount = Object.keys(transfer.pending).length;
        if (pendingCount > 0) throw new Error(`导出数据接收不完整（${pendingCount} 个文件未完成）`);
        transfer.fileCount = message.fileCount || transfer.fileCount || transfer.receivedFiles;
        transfer.stats = message.stats || transfer.stats;
        status.textContent = message.isFinal === false ? "正在准备当前分包..." : "正在打包 zip...";
        status.classList.remove("error");
        blob = finishZipBlob(transfer);
        transfer.localParts = [];
        transfer.centralParts = [];
        await downloadBlob(blob, transfer.filename);
        blob = null;
        if (message.isFinal !== false) bar.style.width = "100%";
        status.textContent = message.isFinal === false ? "当前分包已准备完成，继续导出..." : "下载已准备完成";
        const stats = transfer.stats || {};
        const imageAssetCount = stats.imageAssetCount || 0;
        const missingImageAssetCount = stats.missingImageAssetCount || 0;
        summary.textContent = `${stats.pageCount || 0} 个页面，${stats.layerCount || 0} 个图层，${imageAssetCount} 个图片资源${missingImageAssetCount ? `，${missingImageAssetCount} 个图片缺失` : ""}`;
        success = true;
      } catch (error) {
        errorMessage = error.message || "zip 打包失败";
        status.textContent = errorMessage;
        status.classList.add("error");
        summary.textContent = "导出数据已生成，但浏览器端打包失败。";
      } finally {
        pendingCount = Object.keys(transfer.pending).length;
      }

      const filename = transfer.filename;
      exportTransfer = null;
      setBusy(message.isFinal === false && success);
      await waitForUIRelease();
      send({
        type: "export-transfer-finished",
        transferId: message.transferId,
        success,
        error: errorMessage,
        pendingCount,
        filename
      });
    }

    function normalizeBytes(value) {
      if (value instanceof Uint8Array) return value;
      if (Array.isArray(value)) return new Uint8Array(value);
      if (value && typeof value.length === "number") return new Uint8Array(value);
      if (value && typeof value === "object") {
        const keys = Object.keys(value).map(Number).filter(Number.isFinite).sort((a, b) => a - b);
        const bytes = new Uint8Array(keys.length);
        keys.forEach((key, index) => {
          bytes[index] = value[key];
        });
        return bytes;
      }
      return new Uint8Array();
    }

    window.onmessage = async (event) => {
      const message = getPluginMessage(event);
      if (!message) return;

      if (message.type === "init") {
        currentPageId = message.currentPageId || "";
        pendingExportQueue = message.exportQueue || null;
        renderPages(message.pages);
        return;
      }

      if (message.type === "export-queue-updated") {
        pendingExportQueue = message.exportQueue || null;
        if (isAutoSessionActive()) {
          scheduleNextAutoExportBatch(pendingExportQueue);
          return;
        }
        applyExportQueueSelection(pendingExportQueue);
        setBusy(false);
        return;
      }

      if (message.type === "export-queue-cleared") {
        pendingExportQueue = null;
        if (isAutoSessionActive()) {
          finishAutoExportSession();
        }
        return;
      }

      if (message.type === "progress") {
        setProgress(message.current || 0, message.total || 0, message.label);
        return;
      }

      if (message.type === "main-relay-test-result") {
        testMainRelay.disabled = isBusy;
        if (message.ok) {
          const detail = `主线程直连成功：HTTP ${message.status || 200}，${message.elapsedMs || 0}ms`;
          status.textContent = detail;
          status.classList.remove("error");
          relayDiagnostic.textContent = `${detail}。可以考虑把上传链路移到 code.ts。`;
          relayDiagnostic.classList.remove("error");
          summary.textContent = `fetch=${message.fetchAvailable ? "可用" : "不可用"} · ${message.relayUrl || ""}`;
        } else {
          const errorText = message.error || "主线程直连失败";
          status.textContent = errorText;
          status.classList.add("error");
          relayDiagnostic.textContent = `主线程直连失败：${errorText}`;
          relayDiagnostic.classList.add("error");
          summary.textContent = `fetch=${message.fetchAvailable ? "可用" : "不可用"} · ${message.relayUrl || ""}`;
        }
        return;
      }

      if (message.type === "export-transfer-start") {
        if (isLocalRelayMessage(message)) {
          startLocalRelayTransfer(message);
        } else {
          startExportTransfer(message);
        }
        return;
      }

      if (message.type === "export-file-start") {
        if (isLocalRelayMessage(message)) {
          startLocalRelayFile(message);
        } else {
          startExportFile(message);
        }
        return;
      }

      if (message.type === "export-file-chunk") {
        if (isLocalRelayMessage(message)) {
          appendLocalRelayFileChunk(message);
        } else {
          appendExportFileChunk(message);
        }
        return;
      }

      if (message.type === "export-file-end") {
        if (isLocalRelayMessage(message)) {
          await acknowledgeLocalRelayFile(message);
        } else {
          acknowledgeExportFile(message);
        }
        return;
      }

      if (message.type === "export-file-abort") {
        if (isLocalRelayMessage(message)) {
          abortLocalRelayFile(message);
        } else {
          abortExportFile(message);
        }
        return;
      }

      if (message.type === "export-transfer-complete") {
        if (isLocalRelayMessage(message)) {
          await completeLocalRelayTransfer(message);
        } else {
          await completeExportTransfer(message);
        }
        return;
      }

      if (message.type === "export-ready") {
        setProgress(message.manifest.stats.layerCount, message.manifest.stats.layerCount, "正在打包 zip...");
        const blob = makeZipBlob(message.files);
        downloadBlob(blob, message.filename || "mastergo2figma.zip");
        bar.style.width = "100%";
        status.textContent = "下载已准备完成";
        const imageAssetCount = message.manifest.stats.imageAssetCount || 0;
        const missingImageAssetCount = message.manifest.stats.missingImageAssetCount || 0;
        summary.textContent = `${message.manifest.stats.pageCount} 个页面，${message.manifest.stats.layerCount} 个图层，${imageAssetCount} 个图片资源${missingImageAssetCount ? `，${missingImageAssetCount} 个图片缺失` : ""}`;
        setBusy(false);
        return;
      }

      if (message.type === "error") {
        exportTransfer = null;
        if (autoExportSession) {
          failAutoExportSession(message.message || "导出失败");
          return;
        }
        status.textContent = message.message || "导出失败";
        status.classList.add("error");
        summary.textContent = "请查看插件控制台获取更多信息。";
        setBusy(false);
      }
    };

    send({ type: "ui-ready" });
    setTimeout(() => send({ type: "ui-ready" }), 100);
    updateTransferMode();

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function cssEscape(value) {
      if (window.CSS && typeof window.CSS.escape === "function") return CSS.escape(value);
      return String(value).replace(/"/g, '\\"');
    }

    const ZIP_FLAG_UTF8 = 0x0800;
    const ZIP_FLAG_DATA_DESCRIPTOR = ZIP_FLAG_UTF8 | 0x0008;

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      return new Promise(resolve => {
        setTimeout(() => {
          URL.revokeObjectURL(url);
          resolve();
        }, 2000);
      });
    }

    function waitForUIRelease() {
      return new Promise(resolve => setTimeout(resolve, 500));
    }

    function appendZipFile(transfer, file) {
      const nameBytes = transfer.encoder.encode(file.path);
      const data = getFileBytes(file, transfer.encoder);
      const crc = crc32(data);
      const localHeader = new Uint8Array(30 + nameBytes.length);
      const localView = new DataView(localHeader.buffer);
      writeLocalHeader(localView, nameBytes.length, crc, data.length);
      localHeader.set(nameBytes, 30);
      transfer.localParts.push(localHeader, data);

      const centralHeader = new Uint8Array(46 + nameBytes.length);
      const centralView = new DataView(centralHeader.buffer);
      writeCentralHeader(centralView, nameBytes.length, crc, data.length, transfer.offset);
      centralHeader.set(nameBytes, 46);
      transfer.centralParts.push(centralHeader);
      transfer.offset += localHeader.length + data.length;
    }

    function finishZipBlob(transfer) {
      const centralSize = transfer.centralParts.reduce((sum, part) => sum + part.length, 0);
      const end = new Uint8Array(22);
      const endView = new DataView(end.buffer);
      const fileCount = transfer.centralParts.length;
      endView.setUint32(0, 0x06054b50, true);
      endView.setUint16(8, fileCount, true);
      endView.setUint16(10, fileCount, true);
      endView.setUint32(12, centralSize, true);
      endView.setUint32(16, transfer.offset, true);
      for (const part of transfer.centralParts) transfer.localParts.push(part);
      transfer.localParts.push(end);
      transfer.centralParts = [];
      return new Blob(transfer.localParts, { type: "application/zip" });
    }

    function makeZipBlob(files) {
      const encoder = new TextEncoder();
      const transfer = {
        encoder,
        localParts: [],
        centralParts: [],
        offset: 0
      };
      for (const file of files) {
        appendZipFile(transfer, file);
      }
      return finishZipBlob(transfer);
    }

    function getFileBytes(file, encoder) {
      if (file.bytes !== undefined) {
        if (file.bytes instanceof Uint8Array) return file.bytes;
        if (Array.isArray(file.bytes)) return new Uint8Array(file.bytes);
        if (file.bytes && typeof file.bytes.length === "number") return new Uint8Array(file.bytes);
      }
      return encoder.encode(file.content || "");
    }

    function writeLocalHeader(view, nameLength, crc, size, flags = ZIP_FLAG_UTF8) {
      view.setUint32(0, 0x04034b50, true);
      view.setUint16(4, 20, true);
      view.setUint16(6, flags, true);
      view.setUint16(8, 0, true);
      view.setUint16(10, 0, true);
      view.setUint16(12, 0, true);
      view.setUint32(14, crc, true);
      view.setUint32(18, size, true);
      view.setUint32(22, size, true);
      view.setUint16(26, nameLength, true);
      view.setUint16(28, 0, true);
    }

    function writeCentralHeader(view, nameLength, crc, size, offset, flags = ZIP_FLAG_UTF8) {
      view.setUint32(0, 0x02014b50, true);
      view.setUint16(4, 20, true);
      view.setUint16(6, 20, true);
      view.setUint16(8, flags, true);
      view.setUint16(10, 0, true);
      view.setUint16(12, 0, true);
      view.setUint16(14, 0, true);
      view.setUint32(16, crc, true);
      view.setUint32(20, size, true);
      view.setUint32(24, size, true);
      view.setUint16(28, nameLength, true);
      view.setUint16(30, 0, true);
      view.setUint16(32, 0, true);
      view.setUint16(34, 0, true);
      view.setUint16(36, 0, true);
      view.setUint32(38, 0, true);
      view.setUint32(42, offset, true);
    }

    function crc32(bytes) {
      return (crc32Update(-1, bytes) ^ -1) >>> 0;
    }

    function crc32Update(crc, bytes) {
      for (let i = 0; i < bytes.length; i++) {
        crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
      }
      return crc;
    }

    const crcTable = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i++) {
        let c = i;
        for (let k = 0; k < 8; k++) {
          c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        }
        table[i] = c >>> 0;
      }
      return table;
    })();
  </script>
